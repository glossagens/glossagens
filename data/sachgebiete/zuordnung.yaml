# Einordnung der Kommentare in die Sachgebiete.
#
# Die Sachgebiete sind ein zweiter Zugang neben der SR-Ordnung: Sie führen auf
# die Sachgebiet-Seiten, in die Querverweise zwischen Themen und Kommentaren
# und in den Index für bger-update. Die Übersicht unter /kommentar/ und die
# Artikelfolge bleiben davon unberührt (SR-Nummer bzw. Verzeichnisname).
#
# Die Zuordnung steht bewusst hier und nicht im Frontmatter: Gesetzes- und
# Artikeldateien bleiben unverändert, eine blosse Einordnung erzeugt keinen
# Revisionseintrag, und alles ist an einer Stelle überblickbar.
#
# Aufbau je Gesetz (Schlüssel = Verzeichnisname unter content/kommentar/):
#
#   or:
#     standard: [schuldrecht]                  # Pflicht: gilt für jeden Artikel
#     bereiche:                                # optional, nach Artikelnummer
#       - { von: 319, bis: 362, sachgebiete: [schuldrecht.arbeit] }
#     artikel:                                 # optional, nach Verzeichnisname
#       art-336: [schuldrecht.arbeit, personalrecht]
#
# Auflösung: Artikeleintrag vor engstem Bereich vor Standard. Die genauere Ebene
# ersetzt die gröbere, sie ergänzt sie nicht — wer beides will, nennt beides.
# Die Nummer wird wie in data/systematik/ aus dem Verzeichnisnamen gelesen
# (art-066a → 66), Bereiche dürfen sich überschneiden.
#
# Schlüssel: data/sachgebiete/bger.yaml (Bundesgericht) und eigene.yaml. Ein
# unbekannter Schlüssel, ein unbekanntes Gesetz oder ein nicht vorhandener
# Artikel bricht den Build ab. Ein Gesetz ohne Eintrag erzeugt eine Warnung.
#
# So genau wie möglich taggen: bger-update sucht über diese Schlüssel nach
# Material zu einem Urteil. Ein Untergebiet trifft die passenden Urteile, das
# blosse Sachgebiet trifft alle seines Gebiets.

