    name = "Kommentar"
    pageRef = "/kommentar"
    weight = 1
  [[menu.main]]
    name = "Über"
    pageRef = "/ueber"
    weight = 2
  [[menu.main]]
    name = "Einreichung"
    pageRef = "/einreichung"
    weight = 3
